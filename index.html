<!DOCTYPE html>
<html>

<head>
    <title>Users Feed</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Users Feed</h1>
    <div id="users-container"></div>
    <script>         const usersContainer = document.getElementById("users-container");
        fetch("https://jsonplaceholder.typicode.com/users").then(response => response.json()).then(users => {
            users.slice(0, 6).forEach(user => {
                const card = document.createElement("div"); card.className = "user-card";
                card.innerHTML = `                         <h2>${user.name}</h2>
                        <p><strong>Username:</strong> ${user.username}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <button>Remove User</button>                     `;
                const removeButton = card.querySelector("button");
                removeButton.addEventListener("click", () => {
                    fetch(`https://jsonplaceholder.typicode.com/users/${user.id}`, { method: "DELETE" }).then(response => {
                        if (response.status === 200) { card.remove(); }
                    });
                });
                usersContainer.appendChild(card);
            });
        });
    </script>
</body>

</html>
